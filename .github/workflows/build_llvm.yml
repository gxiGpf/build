name: llvm Build

on:
  workflow_dispatch:
  push:
    branches:
      - zig
jobs:
  llvm-build:
    name: llvm Build
    runs-on: windows-2022
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Prepare
        run: |
          (new-object System.Net.WebClient).DownloadFile('https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/clang-19.1.7.src.tar.xz', 'C:\clang.src.tar.xz')
          (new-object System.Net.WebClient).DownloadFile('https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/llvm-19.1.7.src.tar.xz','C:\llvm.src.tar.xz')
          (new-object System.Net.WebClient).DownloadFile('https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/lld-19.1.7.src.tar.xz','C:\lld.src.tar.xz')
          tar -xvf C:\clang.src.tar.xz -C C:\
          tar -xvf C:\llvm.src.tar.xz -C C:\
          tar -xvf C:\lld.src.tar.xz -C C:\
          mkdir C:\llvm-19.1.7\build-release ; cd C:\llvm-19.1.7\build-release
          cmake.exe .. -G Ninja -DCMAKE_INSTALL_PREFIX=C:\llvm+clang+lld-19.1.7-x86_64-windows-msvc-release-mt -DCMAKE_PREFIX_PATH=C:\llvm+clang+lld-19.1.7-x86_64-windows-msvc-release-mt -DLLVM_ENABLE_ZLIB=OFF -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_USE_CRT_RELEASE=MT
          ninja ; ninja install
          mkdir C:\lld-19.1.7\build-release ; cd C:\lld-19.1.7\build-release
          cmake.exe .. -G Ninja -DCMAKE_INSTALL_PREFIX=C:\llvm+clang+lld-19.1.7-x86_64-windows-msvc-release-mt -DCMAKE_PREFIX_PATH=C:\llvm+clang+lld-19.1.7-x86_64-windows-msvc-release-mt -DCMAKE_BUILD_TYPE=Release -DLLVM_USE_CRT_RELEASE=MT
          ninja ; ninja install
          mkdir C:\clang-19.1.7\build-release ; cd C:\clang-19.1.7\build-release
          cmake.exe .. -G Ninja -DCMAKE_INSTALL_PREFIX=C:\llvm+clang+lld-19.1.7-x86_64-windows-msvc-release-mt -DCMAKE_PREFIX_PATH=C:\llvm+clang+lld-19.1.7-x86_64-windows-msvc-release-mt -DCMAKE_BUILD_TYPE=Release -DLLVM_USE_CRT_RELEASE=MT
          ninja ; ninja install
      - name: Pack llvm
        run: |
          7z a C:\llvm+clang+lld-19.1.7-x86_64-windows-msvc-release-mt.7z C:\llvm+clang+lld-19.1.7-x86_64-windows-msvc-release-mt
      - uses: actions/upload-artifact@v4
        with:
          name: llvm
          path: C:\llvm+clang+lld-19.1.7-x86_64-windows-msvc-release-mt.7z
      - name: Update llvm Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zig-build
          files: |
            C:\llvm+clang+lld-19.1.7-x86_64-windows-msvc-release-mt.7z