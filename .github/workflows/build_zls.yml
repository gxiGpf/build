name: codex Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex
jobs:
  codex-build:
    name: codex Build
    runs-on: windows-2022
    steps:
      - name: Build Pack codex
        run: |
          cd C:\ ; git clone --depth=1 https://github.com/openai/codex
          cd codex/codex-rs ; cargo build --bin codex
          7z a C:\codex_master_debug.7z target/debug/codex.exe target/debug/codex.pdb
      - uses: actions/upload-artifact@v4
        with:
          name: codex_master_debug
          path: C:\codex_master_debug.7z
      - name: Update codex debug
        uses: softprops/action-gh-release@v2
        with:
          tag_name: codex-build
          files: |
            C:\codex_master_debug.7z
