      - name: Setup dependencies
        run: |
          cd C:\ ; git clone --depth=1 --recurse-submodules https://github.com/frida/frida.git -b ${{ env.FRIDA_VERSION }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Build
        run: |
          cd C:\frida ; 
          .\configure.bat --prefix=${{ env.FRIDA_PREFIX }} --host=windows-x86_64 --enable-shared -- "-Dfrida-gum:devkits=gum,gumjs" "-Dfrida-core:devkits=core"
          .\make
          .\make install
          ls C:\frida-build
      - name: Package Directories
        run: |
          7z a frida-win-x64-devkits_core.7z ${{ env.FRIDA_PREFIX }}/lib/frida/devkits/core/
      - uses: actions/upload-artifact@v4
        with:
          name: frida-win-x64-devkits_core
          path: frida-win-x64-devkits_core.7z
