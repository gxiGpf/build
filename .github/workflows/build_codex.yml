  codex-custom-win-build:
    name: codex Build
    runs-on: windows-2022
    steps:
      - name: Build Pack codex
        run: |
          $env:CARGO_PKG_VERSION=${{ env.LATEST_VERSION }}
          cd C:\ ; git clone --depth=1 https://github.com/gxiGpf/codex -b win 
          cd codex/codex-rs ; cargo build --release --bin codex
          7z a C:\codex_custom_win_release.7z target/release/codex.exe
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: codex_custom_win_release
      #     path: C:\codex_custom_win_release.7z
      - name: Update codex custom win release build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: codex-build
          files: |

            C:\codex_custom_win_release.7z

  codex-custom-more-build:
    name: codex more Build
    runs-on: windows-2022
    steps:
