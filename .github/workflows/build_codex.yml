          cd C:\ ; git clone --depth=1 https://github.com/gxiGpf/codex -b more 
          cd codex/codex-rs ; cargo build --release --bin codex
          7z a C:\codex_custom_more_win_release.7z target/release/codex.exe
      - name: Update codex custom win release build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: codex-build
          files: |

            C:\codex_custom_more_win_release.7z


